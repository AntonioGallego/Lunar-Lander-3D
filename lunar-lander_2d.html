<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNAR LANDER — VECTREX</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh;
    font-family:'Share Tech Mono',monospace;
    overflow:hidden;
  }
  .cabinet { position:relative; display:flex; flex-direction:column; align-items:center; }
  .screen-bezel {
    background:#0a0a0a;
    border:3px solid #1a1a1a; border-radius:8px; padding:16px;
    box-shadow:0 0 0 2px #111, 0 0 40px rgba(0,255,120,0.08), inset 0 0 30px rgba(0,0,0,0.8);
    position:relative;
  }
  .screen-bezel::before {
    content:'VECTREX'; position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    color:#2a4a2a; font-size:11px; letter-spacing:6px;
  }
  canvas { display:block; background:#000; border-radius:4px;
    box-shadow:0 0 0 1px #0f2a0f;
    filter:contrast(1.1) brightness(1.05); }
  .scanlines {
    position:absolute; top:16px; left:16px;
    width:calc(100% - 32px); height:calc(100% - 32px); border-radius:4px;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
    pointer-events:none; z-index:10;
  }
  .vignette {
    position:absolute; top:16px; left:16px;
    width:calc(100% - 32px); height:calc(100% - 32px); border-radius:4px;
    background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index:11;
  }
  .hud {
    margin-top:12px; display:flex; gap:24px;
    color:#00ff78; font-size:12px; letter-spacing:2px;
    text-shadow:0 0 8px #00ff78,0 0 16px #00ff78;
  }
  .hud .val { color:#80ffbb; }
  .controls-hint { margin-top:8px; color:#1a4a2a; font-size:10px; letter-spacing:3px; text-align:center; }
  .overlay {
    position:absolute; top:16px; left:16px;
    width:calc(100% - 32px); height:calc(100% - 32px); border-radius:4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; z-index:20;
  }
  .overlay.hidden { display:none; }
  .overlay h1 {
    color:#00ff78; font-size:26px; letter-spacing:6px; line-height:1.5; text-align:center;
    text-shadow:0 0 12px #00ff78,0 0 30px #00ff78;
    animation:flicker 3s infinite;
  }
  .overlay p { color:#80ffbb; font-size:11px; letter-spacing:3px; margin-top:14px; animation:blink 1s infinite; }
  .diff-label { color:#40aa66; font-size:10px; letter-spacing:3px; margin-top:18px; }
  .diff-row { display:flex; gap:6px; margin-top:8px; pointer-events:all; }
  .diff-btn {
    width:30px; height:30px; background:transparent; border:1.5px solid #006633;
    color:#00ff78; font-family:'Share Tech Mono',monospace; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.1s; box-shadow:0 0 6px rgba(0,255,120,0.2);
  }
  .diff-btn:hover { border-color:#00ff78; box-shadow:0 0 12px #00ff78; }
  .diff-btn.active { background:#00ff78; color:#000; box-shadow:0 0 16px #00ff78,0 0 30px #00ff78; }
  @keyframes flicker { 0%,100%{opacity:1}92%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}97%{opacity:1} }
  @keyframes blink { 0%,49%{opacity:1}50%,100%{opacity:0} }
</style>
</head>
<body>
<div class="cabinet">
  <div class="screen-bezel">
    <canvas id="c" width="480" height="540"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="overlay" id="overlay">
      <h1 id="msgTitle">LUNAR<br>LANDER</h1>
      <div class="diff-label" id="diffLabel">SELECT DIFFICULTY</div>
      <div class="diff-row" id="diffRow"></div>
      <p id="msgSub">PRESS SPACE / TAP TO LAUNCH</p>
    </div>
  </div>
  <div class="hud">
    <span>FUEL <span class="val" id="hudFuel">100</span></span>
    <span>ALT <span class="val" id="hudAlt">--</span></span>
    <span>VY <span class="val" id="hudVy">0.0</span></span>
    <span>DIFF <span class="val" id="hudDiff">3</span></span>
    <span>SCORE <span class="val" id="hudScore">0</span></span>
  </div>
  <div class="controls-hint">← → ROTATE &nbsp;|&nbsp; ↑ / SPACE THRUST &nbsp;|&nbsp; TAP TO PLAY</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Difficulty ─────────────────────────────────────────────────────
let difficulty = 3;
const diffRow = document.getElementById('diffRow');
for (let i = 1; i <= 9; i++) {
  const b = document.createElement('button');
  b.className = 'diff-btn' + (i === 3 ? ' active' : '');
  b.textContent = i;
  b.addEventListener('click', e => {
    e.stopPropagation();
    difficulty = i;
    document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('hudDiff').textContent = i;
  });
  diffRow.appendChild(b);
}

function getP() {
  const d = difficulty;
  // t: 0=easiest(d=1) .. 1=hardest(d=9), curved so low levels are gentler
  const t = ((d - 1) / 8) ** 1.5;
  return {
    gravity:     0.008 + t * 0.032,       // d1:0.008  d5:0.018  d9:0.040
    thrust:      0.072 - t * 0.030,       // d1:0.072  d5:0.057  d9:0.042
    rotate:      0.082 - t * 0.022,       // d1:0.082  d5:0.071  d9:0.060
    safeVY:      3.2  - t * 2.1,          // d1:3.2    d5:2.0    d9:1.1
    safeVX:      2.6  - t * 1.8,          // d1:2.6    d5:1.7    d9:0.8
    safeAngle:   0.70 - t * 0.50,         // d1:0.70   d5:0.45   d9:0.20
    fuelRate:    0.10 + t * 0.28,         // d1:0.10   d5:0.18   d9:0.38
    initFuel:    Math.round(200 - t*100), // d1:200    d5:150    d9:100
    initVX:      t * 0.55,                // d1:0      d5:0.24   d9:0.55
    padWidth:    d <= 2 ? 5 : d <= 4 ? 4 : d <= 6 ? 3 : 2,
    numPads:     d <= 4 ? 2 : 1,
  };
}

// ── Vector draw helpers ────────────────────────────────────────────
function vecLine(x1, y1, x2, y2, color = '#00ff78', glow = 14, w = 1.5) {
  ctx.save();
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.lineJoin = 'round';
  [[w + glow * 0.3, 0.18, glow], [w * 0.8, 0.55, glow * 0.45], [w * 0.45, 1.0, glow * 0.2]].forEach(([lw, a, b]) => {
    ctx.lineWidth = lw; ctx.globalAlpha = a; ctx.shadowBlur = b;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
  ctx.restore();
}
function vecPoly(pts, color = '#00ff78', glow = 14, close = true, w = 1.5) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color; ctx.shadowColor = color; ctx.lineJoin = 'round';
  [[w + glow * 0.3, 0.18, glow], [w * 0.8, 0.55, glow * 0.45], [w * 0.45, 1.0, glow * 0.2]].forEach(([lw, a, b]) => {
    ctx.lineWidth = lw; ctx.globalAlpha = a; ctx.shadowBlur = b;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath(); ctx.stroke();
  });
  ctx.restore();
}
function vecText(txt, x, y, size = 12, color = '#00ff78', glow = 10) {
  ctx.save();
  ctx.font = `${size}px 'Share Tech Mono',monospace`;
  ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.shadowColor = color;
  [glow * 1.4, glow * 0.55, glow * 0.15].forEach((bl, i) => {
    ctx.shadowBlur = bl; ctx.globalAlpha = i === 0 ? 0.35 : i === 1 ? 0.8 : 1;
    ctx.fillText(txt, x, y);
  });
  ctx.restore();
}

// ── Stars ──────────────────────────────────────────────────────────
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.55, r: Math.random() }));

// ── Terrain ────────────────────────────────────────────────────────
let terrain;
function genTerrain() {
  const p = getP();
  const segs = 26, dx = W / segs, pts = [];
  const zones = [];
  const used = new Set();
  for (let z = 0; z < p.numPads; z++) {
    let s, tries = 0;
    do { s = 3 + Math.floor(Math.random() * (segs - p.padWidth - 4)); tries++; }
    while ([...used].some(u => Math.abs(u - s) < p.padWidth + 3) && tries < 20);
    zones.push({ start: s, end: s + p.padWidth });
    for (let i = s; i <= s + p.padWidth; i++) used.add(i);
  }
  let y = H * 0.52 + (Math.random() - 0.5) * 60;
  for (let i = 0; i <= segs; i++) {
    const x = i * dx;
    const z = zones.find(z => i >= z.start && i <= z.end);
    if (z) {
      if (i === z.start) { z.y = y; z.x1 = x; }
      y = z.y;
      if (i === z.end) z.x2 = x;
    } else {
      y += (Math.random() - 0.5) * 65;
      y = Math.max(H * 0.32, Math.min(H * 0.80, y));
    }
    pts.push([x, y]);
  }
  return { pts, zones };
}

// ── Particles ──────────────────────────────────────────────────────
let particles = [];
function spawnThrust(x, y, angle) {
  for (let i = 0; i < 2; i++) {
    const a = angle + Math.PI + (Math.random() - 0.5) * 0.55;
    const spd = 1.2 + Math.random() * 1.8;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1, decay: 0.07 + Math.random() * 0.07, type: 'thrust' });
  }
}
function spawnExplosion(x, y) {
  for (let i = 0; i < 38; i++) {
    const a = Math.random() * Math.PI * 2, spd = 0.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 1, decay: 0.018 + Math.random() * 0.035, type: 'exp' });
  }
}
function spawnLanding(x, y) {
  for (let i = 0; i < 16; i++) {
    const a = -Math.PI + Math.random() * Math.PI, spd = 0.5 + Math.random() * 2;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 1, life: 1, decay: 0.03 + Math.random() * 0.03, type: 'land' });
  }
}

// ── Game state ─────────────────────────────────────────────────────
let state = 'title', lander, score = 0, frameCount = 0;

function initGame() {
  const p = getP();
  terrain = genTerrain();
  particles = [];
  frameCount = 0;
  lander = {
    x: W * 0.5, y: 65,
    vx: (Math.random() - 0.5) * p.initVX * 2,
    vy: 0.25,
    angle: 0,
    fuel: p.initFuel,
    thrusting: false,
    dead: false,
  };
  state = 'playing';
  document.getElementById('overlay').classList.add('hidden');
}

function showOverlay(title, sub, showDiff = false) {
  const ov = document.getElementById('overlay');
  ov.classList.remove('hidden');
  document.getElementById('msgTitle').innerHTML = title;
  document.getElementById('msgSub').textContent = sub;
  const show = showDiff ? 'flex' : 'none';
  document.getElementById('diffRow').style.display = show;
  document.getElementById('diffLabel').style.display = showDiff ? 'block' : 'none';
}

// ── Input ──────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    if (state === 'title' || state === 'dead' || state === 'landed') initGame();
  }
}, { passive: false });
document.addEventListener('keyup', e => { keys[e.code] = false; });

let touchLeft = false, touchRight = false, touchThrust = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state !== 'playing') { initGame(); return; }
  for (const t of e.changedTouches) {
    const r = canvas.getBoundingClientRect();
    const tx = (t.clientX - r.left) * (W / r.width);
    const ty = (t.clientY - r.top) * (H / r.height);
    if (ty < H * 0.55) touchThrust = true;
    else if (tx < W / 2) touchLeft = true;
    else touchRight = true;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); touchLeft = touchRight = touchThrust = false; }, { passive: false });

// ── Terrain helpers ────────────────────────────────────────────────
function terrainYAt(x) {
  const pts = terrain.pts;
  for (let i = 0; i < pts.length - 1; i++) {
    if (x >= pts[i][0] && x <= pts[i + 1][0]) {
      const t = (x - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
      return pts[i][1] * (1 - t) + pts[i + 1][1] * t;
    }
  }
  return H;
}
function isOnPad(x) { return terrain.zones.find(z => z.x1 && x >= z.x1 && x <= z.x2) || null; }

// ── Update ─────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  frameCount++;
  const p = getP();
  const rotL = keys['ArrowLeft'] || keys['KeyA'] || touchLeft;
  const rotR = keys['ArrowRight'] || keys['KeyD'] || touchRight;
  const thrust = keys['ArrowUp'] || keys['Space'] || keys['KeyW'] || touchThrust;

  if (rotL) lander.angle -= p.rotate;
  if (rotR) lander.angle += p.rotate;

  lander.thrusting = thrust && lander.fuel > 0;
  if (lander.thrusting) {
    lander.vx += Math.sin(lander.angle) * p.thrust;
    lander.vy -= Math.cos(lander.angle) * p.thrust;
    lander.fuel = Math.max(0, lander.fuel - p.fuelRate);
    spawnThrust(lander.x, lander.y, lander.angle);
  }

  lander.vy += p.gravity;
  lander.vx *= 0.999;
  lander.x += lander.vx;
  lander.y += lander.vy;
  if (lander.x < -20) lander.x = W + 20;
  if (lander.x > W + 20) lander.x = -20;

  const gY = terrainYAt(lander.x);
  if (lander.y >= gY - 12) {
    const pad = isOnPad(lander.x);
    const na = Math.abs(lander.angle % (Math.PI * 2));
    const normA = Math.min(na, Math.PI * 2 - na);
    if (pad && Math.abs(lander.vy) < p.safeVY && Math.abs(lander.vx) < p.safeVX && normA < p.safeAngle) {
      lander.y = gY - 12; lander.vx = lander.vy = 0;
      const bonus = Math.floor(lander.fuel * 5) + Math.floor((p.safeVY - Math.abs(lander.vy)) * 120) + 500;
      score += bonus;
      document.getElementById('hudScore').textContent = score;
      spawnLanding(lander.x, lander.y);
      state = 'landed';
      setTimeout(() => showOverlay(`TOUCHDOWN<br><span style="font-size:15px;letter-spacing:3px">+${bonus} PTS</span>`, 'SPACE / TAP FOR NEXT LEVEL', false), 500);
    } else {
      spawnExplosion(lander.x, gY);
      lander.dead = true; state = 'dead';
      setTimeout(() => showOverlay('CRASH', 'SPACE / TAP TO RETRY', false), 700);
    }
  }

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'exp' || p.type === 'land') p.vy += 0.07;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);

  document.getElementById('hudFuel').textContent = Math.ceil(lander.fuel);
  document.getElementById('hudAlt').textContent = Math.max(0, Math.floor(terrainYAt(lander.x) - lander.y));
  document.getElementById('hudVy').textContent = lander.vy.toFixed(1);
}

// ── Draw lander ─────────────────────────────────────────────────────
// Minimal: inverted V body + two legs + nozzle bell
function drawLander(x, y, angle, thrusting, fuel) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const r = ([lx, ly]) => [x + lx * c - ly * s, y + lx * s + ly * c];

  // Body: simple triangle (pointing up)
  vecPoly([r([0, -14]), r([11, 7]), r([-11, 7])], '#00ff78', 14, true, 2);

  // Legs
  vecLine(...r([-9, 6]), ...r([-16, 15]), '#00ff78', 10, 1.5);
  vecLine(...r([9, 6]),  ...r([16, 15]),  '#00ff78', 10, 1.5);
  // Foot pads
  vecLine(...r([-19, 14]), ...r([-13, 14]), '#00ff78', 10, 1.5);
  vecLine(...r([13, 14]),  ...r([19, 14]),  '#00ff78', 10, 1.5);

  // Nozzle: small trapezoid at bottom
  vecPoly([r([-4, 7]), r([4, 7]), r([3, 12]), r([-3, 12])], '#00ff78', 9, true, 1.2);

  // Flame
  if (thrusting && fuel > 0) {
    const fl = 9 + Math.random() * 10;
    const fw = (Math.random() - 0.5) * 3;
    vecPoly([r([-3, 12]), r([fw, 12 + fl]), r([3, 12])], '#ffee00', 24, true, 1.5);
    vecLine(...r([0, 12]), ...r([fw * 0.4, 12 + fl * 0.65]), '#ffffff', 12, 0.7);
  }
}

// ── Draw terrain ──────────────────────────────────────────────────
function drawTerrain() {
  const pts = terrain.pts;
  ctx.save();
  ctx.fillStyle = '#001508';
  ctx.beginPath(); ctx.moveTo(pts[0][0], H);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(pts[pts.length - 1][0], H); ctx.closePath(); ctx.fill();
  ctx.restore();
  vecPoly(pts, '#00ff78', 11, false, 1.5);

  terrain.zones.forEach(z => {
    if (!z.x1) return;
    vecLine(z.x1, z.y, z.x2, z.y, '#00ffcc', 22, 2.5);
    vecLine(z.x1, z.y - 8, z.x1, z.y + 2, '#00ffcc', 10, 1.5);
    vecLine(z.x2, z.y - 8, z.x2, z.y + 2, '#00ffcc', 10, 1.5);
    vecText('LAND', (z.x1 + z.x2) / 2, z.y - 12, 9, '#00ffcc', 8);
  });
}

// ── Draw particles ─────────────────────────────────────────────────
function drawParticles() {
  particles.forEach(p => {
    const a = p.life;
    const color = p.type === 'thrust' ? `rgba(255,200,60,${a * 0.85})` :
                  p.type === 'exp'    ? `rgba(255,90,10,${a})`         : `rgba(0,255,180,${a})`;
    ctx.save();
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 8;
    ctx.lineWidth = 1.5; ctx.globalAlpha = a;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
    ctx.restore();
  });
}

// ── Draw fuel bar ──────────────────────────────────────────────────
function drawFuelBar() {
  if (state !== 'playing' && state !== 'landed') return;
  const maxFuel = getP().initFuel;
  const pct = Math.max(0, lander.fuel / maxFuel);
  const bx = W - 18, by = 30, bh = H - 60, bw = 8;

  // Pick color based on fuel level
  const color = pct > 0.4 ? '#00ff78' : pct > 0.2 ? '#ffcc00' : '#ff4400';

  // Outline
  vecLine(bx, by, bx, by + bh, '#1a4a2a', 4, 1);
  vecLine(bx - bw, by, bx - bw, by + bh, '#1a4a2a', 4, 1);
  vecLine(bx - bw, by, bx, by, '#1a4a2a', 4, 1);
  vecLine(bx - bw, by + bh, bx, by + bh, '#1a4a2a', 4, 1);

  // Fill: segmented tick marks
  const ticks = 20;
  const tickH = (bh - 4) / ticks;
  const filledTicks = Math.round(pct * ticks);
  for (let i = 0; i < ticks; i++) {
    const ty = by + bh - 2 - i * tickH;
    if (i < filledTicks) {
      // filled segment
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(bx - bw + 2, ty - tickH + 2, bw - 4, tickH - 2);
      ctx.restore();
    }
  }

  // Glowing border
  vecLine(bx, by, bx, by + bh, color, 6, 1);
  vecLine(bx - bw, by, bx - bw, by + bh, color, 6, 1);
  vecLine(bx - bw, by, bx, by, color, 6, 1);
  vecLine(bx - bw, by + bh, bx, by + bh, color, 6, 1);

  // Label
  vecText('F', bx - bw / 2, by - 7, 9, color, 7);

  // Low fuel pulse warning
  if (pct < 0.2 && pct > 0) {
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.25);
    ctx.save();
    ctx.strokeStyle = '#ff4400'; ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 14; ctx.lineWidth = 1.5;
    ctx.globalAlpha = pulse * 0.7;
    ctx.strokeRect(bx - bw - 1, by - 1, bw + 2, bh + 2);
    ctx.restore();
  }
}

// ── Draw warnings ─────────────────────────────────────────────────
function drawWarnings() {
  if (state !== 'playing') return;
  const p = getP();
  const gY = terrainYAt(lander.x), alt = gY - lander.y;
  if (alt < 90) {
    const a = (1 - alt / 90) * 0.55;
    ctx.save();
    ctx.strokeStyle = '#ff3300'; ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 18;
    ctx.lineWidth = 2; ctx.globalAlpha = a * (0.5 + 0.5 * Math.sin(frameCount * 0.35));
    ctx.strokeRect(4, 4, W - 8, H - 8); ctx.restore();
  }
  if (Math.abs(lander.vy) > p.safeVY) vecText('▼ SPEED', W - 55, 18, 10, '#ff4400', 8);
  const na = Math.abs(lander.angle % (Math.PI * 2)), normA = Math.min(na, Math.PI * 2 - na);
  if (normA > p.safeAngle) vecText('⟳ TILT', 55, 18, 10, '#ff8800', 8);
}

// ── Draw stars ─────────────────────────────────────────────────────
function drawStars() {
  stars.forEach(s => {
    const f = 0.4 + 0.6 * (Math.sin(frameCount * 0.04 + s.x) * 0.5 + 0.5);
    ctx.save();
    ctx.fillStyle = '#00ff78'; ctx.shadowColor = '#00ff78'; ctx.shadowBlur = 4;
    ctx.globalAlpha = f * (0.25 + s.r * 0.5);
    ctx.beginPath(); ctx.arc(s.x, s.y, 0.6 + s.r * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

// ── Render ─────────────────────────────────────────────────────────
function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawStars();

  if (state === 'title') {
    ctx.save(); ctx.fillStyle = '#001508';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 18) ctx.lineTo(x, H * 0.72 + Math.sin(x * 0.04) * 18 + Math.cos(x * 0.018) * 14);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
    const ta = frameCount * 0.018;
    drawLander(W / 2 + Math.sin(ta) * 28, H * 0.34 + Math.sin(ta * 1.2) * 10, Math.sin(ta) * 0.22, frameCount % 18 < 11, 100);
  } else {
    drawTerrain();
    drawParticles();
    if (!lander.dead) drawLander(lander.x, lander.y, lander.angle, lander.thrusting, lander.fuel);
    drawFuelBar();
    drawWarnings();
  }
}

// ── Boot ───────────────────────────────────────────────────────────
showOverlay('LUNAR<br>LANDER', 'PRESS SPACE / TAP TO LAUNCH', true);

function loop() {
  update(); render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
